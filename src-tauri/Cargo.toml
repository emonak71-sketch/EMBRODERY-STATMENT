[package]
name = "embroidery_statement"
version = "1.0.13"
description = "Embroidery Statement customer and owner applications"
authors = ["Embroidery Statement"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "embroidery_statement_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "embroidery-statement"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2" }
tauri-plugin-notification = "2.6.0"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
