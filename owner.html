<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="/native-startup.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Embroidery Statement | Owner Control Center</title>
  <link rel="manifest" href="/owner-manifest.json">
  <link rel="icon" type="image/svg+xml" href="/embroidery-statement-logo.svg?v=2">
  <meta name="theme-color" content="#071a35">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ES Owner">
  <link rel="stylesheet" href="/index.css?v=1.0.10">
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100">
  <div id="root"><div role="status" style="min-height:100vh;display:grid;place-items:center;background:#071a35;color:white;font:600 16px system-ui">Loading Embroidery Statement…</div></div>
  <script type="module" src="/owner.tsx"></script>
  <script>
    if ('serviceWorker' in navigator && !window.__TAURI_INTERNALS__ && !window.__TAURI__) {
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!refreshing) { refreshing = true; window.location.reload(); }
      });
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js?v=6').then(reg => {
          reg.update();
          window.setInterval(() => reg.update(), 30 * 60 * 1000);
        }).catch(error => console.warn('Owner PWA update check failed', error));
      });
    }
  </script>
</body>
</html>
