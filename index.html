<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="/native-startup.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Embroidery Statement | Business Management</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/embroidery-statement-logo.svg?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="/embroidery-statement-logo-180.png">
  <meta name="theme-color" content="#0648c8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    @media print {
      .no-print { display: none !important; }
      body { background-color: white !important; }
      .ledger-container { border: none !important; box-shadow: none !important; margin: 0 !important; padding: 0 !important; }
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    .dark ::-webkit-scrollbar-thumb { background: #334155; }
    
    .ledger-preview-wrapper {
      -webkit-overflow-scrolling: touch;
    }
    
    /* Mobile optimization for high animation feel */
    body {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
<link rel="stylesheet" href="/index.css?v=1.0.11">
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors duration-300">
  <div id="root"><div role="status" style="min-height:100vh;display:grid;place-items:center;background:#071a35;color:white;font:600 16px system-ui">Loading Embroidery Statement…</div></div>
  
  <script type="module" src="/index.tsx"></script>
  
  <script>
    if ('serviceWorker' in navigator && !window.__TAURI_INTERNALS__ && !window.__TAURI__) {
      window.addEventListener('load', () => {
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => { if (!refreshing) { refreshing = true; window.location.reload(); } });
        navigator.serviceWorker.register('/sw.js?v=6').then(reg => {
          reg.update();
          window.setInterval(() => reg.update(), 30 * 60 * 1000);
          console.log('Customer app update checks enabled.', reg);
        }).catch(err => {
          console.log('SW registration failed: ', err);
        });
      });
    }
  </script>
</body>
</html>
