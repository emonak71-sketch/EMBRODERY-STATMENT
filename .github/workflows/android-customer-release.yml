name: Customer Android Direct APK Release

on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Android release tag matching package.json (example: android-v1.0.3)'
        required: true
        type: string
        default: 'android-v1.0.3'

permissions:
  contents: write

concurrency:
  group: android-direct-apk-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release-apk:
    name: Build and publish signed Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate Android release version and persistent signing credentials
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_TAG" != "android-v$VERSION" ]]; then
            echo "Android release tag $RELEASE_TAG does not match package version android-v$VERSION."
            exit 1
          fi
          test -n "$ANDROID_KEY_BASE64" || { echo "ANDROID_KEY_BASE64 is required."; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS is required."; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD is required."; exit 1; }
          test -n "$ANDROID_STORE_PASSWORD" || { echo "ANDROID_STORE_PASSWORD is required."; exit 1; }
          echo "ANDROID_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK and NDK components
        shell: bash
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"

      - name: Set up Rust Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Android launcher icons
        run: npm run desktop:icons
      - name: Set up Python for Android icon normalization
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize Tauri Android icon to RGBA
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          icon = Path("src-tauri/icons/icon.png")
          if not icon.is_file():
              raise SystemExit(f"Missing Tauri icon: {icon}")
          with Image.open(icon) as source:
              source.convert("RGBA").save(icon, format="PNG")
          with Image.open(icon) as check:
              if check.mode != "RGBA":
                  raise SystemExit(f"Android icon must be RGBA, got {check.mode}")
          print(f"Verified RGBA Android icon: {icon}")
          PY

      - name: Initialize Tauri Android project
        run: npx --yes @tauri-apps/cli@2 android init --ci --skip-targets-install

      - name: Configure persistent Android release signing
        shell: bash
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/embroidery-android-release.jks"
          printf '%s' "$ANDROID_KEY_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          {
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'storePassword=%s\n' "$ANDROID_STORE_PASSWORD"
            printf 'storeFile=%s\n' "$KEYSTORE_PATH"
          } > src-tauri/gen/android/keystore.properties
          node scripts/configure-android-signing.mjs

      - name: Build signed ARM64 APK only (no AAB)
        shell: bash
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          export ANDROID_NDK_HOME="$NDK_HOME"
          npx --yes @tauri-apps/cli@2 android build --apk --ci --target aarch64

      - name: Prepare signed APK and checksum manifest
        shell: bash
        run: |
          APK_PATH="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -path '*release*' -print -quit)"
          if [[ -z "$APK_PATH" ]]; then
            echo "Signed Android release APK was not generated."
            exit 1
          fi
          cp "$APK_PATH" Embroidery-Statement-Android.apk
          node scripts/create-android-release-manifest.mjs "$PWD/Embroidery-Statement-Android.apk" "$RELEASE_TAG" "$GITHUB_REPOSITORY"

      - name: Create or update the Android-only GitHub release
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" Embroidery-Statement-Android.apk latest-android.json --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh api "repos/$GITHUB_REPOSITORY/releases" \
              -f "tag_name=$RELEASE_TAG" \
              -f "name=Embroidery Statement Android $ANDROID_VERSION" \
              -f "body=Direct ARM64 APK distribution for Embroidery Statement. This release is independent of the Windows updater channel. Install updates with Android's confirmation prompt." \
              -F "draft=false" -F "prerelease=false" -f "make_latest=false" >/dev/null
            gh release upload "$RELEASE_TAG" Embroidery-Statement-Android.apk latest-android.json --repo "$GITHUB_REPOSITORY"
          fi

      - name: Verify published APK and Android update manifest
        shell: bash
        run: |
          MANIFEST_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/latest-android.json"
          APK_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/Embroidery-Statement-Android.apk"
          curl -fsSL "$MANIFEST_URL" -o downloaded-latest-android.json
          node -e "const m=require('./downloaded-latest-android.json'); if(m.version!==process.env.ANDROID_VERSION) throw new Error('Android version mismatch'); if(m.package_id!=='com.embroidery.statement') throw new Error('Android package ID mismatch'); if(m.apk_url!=='$APK_URL') throw new Error('APK URL mismatch'); if(!/^[a-f0-9]{64}$/.test(m.sha256)) throw new Error('Invalid APK SHA-256'); console.log('Verified Android APK update manifest for '+m.version)"
          curl -fIsL "$APK_URL" >/dev/null
