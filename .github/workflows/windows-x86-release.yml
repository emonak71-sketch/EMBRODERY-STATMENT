name: Windows 32-bit Customer Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-x86-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-x86-customer-release
  cancel-in-progress: false

jobs:
  publish-x86:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      EMBROIDERY_UPDATE_PUBLIC_KEY: ${{ vars.EMBROIDERY_UPDATE_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Initialize 32-bit MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Set up Rust i686 MSVC target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check application
        run: npm run typecheck
      - name: Test accounting and recovery
        run: npm run test:accounting
      - name: Test download portal
        run: npm run test:downloads
      - name: Generate Windows icons
        run: npm run desktop:icons
      - name: Validate signing credentials
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:EMBROIDERY_UPDATE_PUBLIC_KEY)) { throw 'Missing EMBROIDERY_UPDATE_PUBLIC_KEY repository variable.' }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) { throw 'Missing TAURI_SIGNING_PRIVATE_KEY repository secret.' }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) { throw 'Missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD repository secret.' }
      - name: Configure updater public key
        shell: pwsh
        run: |
          $config = Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          $config.plugins.updater.pubkey = $env:EMBROIDERY_UPDATE_PUBLIC_KEY
          $config | ConvertTo-Json -Depth 30 | Set-Content 'src-tauri/tauri.conf.json' -Encoding utf8
      - name: Build signed Customer Windows x86 installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npx --yes @tauri-apps/cli@2 build --target i686-pc-windows-msvc --bundles nsis
          if ($LASTEXITCODE -ne 0) { throw 'Signed Windows x86 installer build failed.' }
      - name: Verify x86 installer and signature
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = 'src-tauri/target/i686-pc-windows-msvc/release/bundle/nsis'
          $installer = Get-ChildItem $dir -Filter '*.exe' | Where-Object { $_.Name -match 'x86-setup\.exe$' -and $_.Name -notmatch 'uninstall|Owner' } | Select-Object -First 1
          if (-not $installer) { Get-ChildItem $dir | ForEach-Object { Write-Host $_.Name }; throw 'Expected x86 Customer installer not found.' }
          $sig = $installer.FullName + '.sig'
          if (-not (Test-Path $sig)) { throw 'x86 updater signature missing.' }
          if ([string]::IsNullOrWhiteSpace([IO.File]::ReadAllText($sig).Trim())) { throw 'x86 updater signature is empty.' }
          "INSTALLER_PATH=$($installer.FullName)" >> $env:GITHUB_ENV
          "INSTALLER_NAME=$($installer.Name)" >> $env:GITHUB_ENV
          "SIGNATURE_PATH=$sig" >> $env:GITHUB_ENV
      - name: Upload x86 installer to existing v1.0.14 release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content 'package.json' -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) { throw "Release $tag does not exist." }
          gh release upload $tag "$env:INSTALLER_PATH" "$env:SIGNATURE_PATH" --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish x86 installer assets.' }
      - name: Verify published x86 installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content 'package.json' -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $headers = @{ Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28'; Authorization = "Bearer $env:GH_TOKEN"; 'Cache-Control' = 'no-cache' }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" -Headers $headers -TimeoutSec 30
          $asset = $release.assets | Where-Object { $_.name -eq $env:INSTALLER_NAME } | Select-Object -First 1
          $sig = $release.assets | Where-Object { $_.name -eq "$($env:INSTALLER_NAME).sig" } | Select-Object -First 1
          if (-not $asset -or -not $sig) { throw "Published x86 installer or signature missing. Release assets: $($release.assets.name -join ', ')" }
          foreach ($url in @($asset.browser_download_url,$sig.browser_download_url)) {
            $response = Invoke-WebRequest -Uri $url -Method Head -MaximumRedirection 10 -TimeoutSec 60
            if ($response.StatusCode -ne 200) { throw "Published asset URL did not return HTTP 200: $url" }
            Write-Host "Verified HTTP 200: $url"
          }
          Write-Host "Verified signed Windows x86 installer $($asset.name) in release $tag."
