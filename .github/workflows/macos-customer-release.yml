name: macOS Customer App Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/macos-customer-release.yml'

permissions:
  contents: write

concurrency:
  group: macos-customer-release
  cancel-in-progress: false

jobs:
  build-customer:
    runs-on: macos-14
    timeout-minutes: 120
    env:
      RELEASE_TAG: v1.0.14
      EMBROIDERY_UPDATE_PUBLIC_KEY: ${{ vars.EMBROIDERY_UPDATE_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Rust macOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check and run core contract tests
        run: |
          npm run typecheck
          npm run test:accounting
          npm run test:attendance
          npm run test:app-lock
          npm run test:downloads

      - name: Generate desktop icons
        run: npm run desktop:icons

      - name: Validate updater signing configuration
        shell: bash
        run: |
          test -n "$EMBROIDERY_UPDATE_PUBLIC_KEY" || { echo "Missing EMBROIDERY_UPDATE_PUBLIC_KEY repository variable"; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "Missing TAURI_SIGNING_PRIVATE_KEY repository secret"; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" || { echo "Missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD repository secret"; exit 1; }

      - name: Configure Customer updater public key and macOS DMG bundle
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'src-tauri/tauri.conf.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.bundle.targets = ['dmg'];
          config.bundle.icon = ['icons/icon.png', 'icons/icon.icns'];
          config.plugins.updater.pubkey = process.env.EMBROIDERY_UPDATE_PUBLIC_KEY;
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          NODE

      - name: Build signed Customer macOS Intel DMG
        run: npx --yes @tauri-apps/cli@2 build --target x86_64-apple-darwin --bundles dmg

      - name: Build signed Customer macOS Apple Silicon DMG
        run: npx --yes @tauri-apps/cli@2 build --target aarch64-apple-darwin --bundles dmg

      - name: Verify both DMG installers and updater signatures
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          INTEL_DIR='src-tauri/target/x86_64-apple-darwin/release/bundle/dmg'
          ARM_DIR='src-tauri/target/aarch64-apple-darwin/release/bundle/dmg'
          INTEL_DMG=$(find "$INTEL_DIR" -maxdepth 1 -name '*.dmg' -print -quit)
          ARM_DMG=$(find "$ARM_DIR" -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$INTEL_DMG" || { echo "Intel DMG missing"; exit 1; }
          test -n "$ARM_DMG" || { echo "Apple Silicon DMG missing"; exit 1; }
          for file in "$INTEL_DMG" "$ARM_DMG"; do
            test -s "$file"
            test -s "$file.sig" || { echo "Updater signature missing for $file"; exit 1; }
            hdiutil verify "$file"
            shasum -a 256 "$file"
          done
          INTEL_NAME="Embroidery.Statement_1.0.14_macOS_x64.dmg"
          ARM_NAME="Embroidery.Statement_1.0.14_macOS_arm64.dmg"
          cp "$INTEL_DMG" "$INTEL_NAME"
          cp "$INTEL_DMG.sig" "$INTEL_NAME.sig"
          cp "$ARM_DMG" "$ARM_NAME"
          cp "$ARM_DMG.sig" "$ARM_NAME.sig"
          echo "INTEL_NAME=$INTEL_NAME" >> "$GITHUB_ENV"
          echo "ARM_NAME=$ARM_NAME" >> "$GITHUB_ENV"
          echo "INTEL_SIG=$(cat "$INTEL_NAME.sig")" >> "$GITHUB_ENV"
          echo "ARM_SIG=$(cat "$ARM_NAME.sig")" >> "$GITHUB_ENV"

      - name: Generate Customer macOS updater manifest
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const tag = process.env.RELEASE_TAG;
          const repo = process.env.GITHUB_REPOSITORY;
          const intel = process.env.INTEL_NAME;
          const arm = process.env.ARM_NAME;
          const manifest = {
            version: '1.0.14',
            notes: 'Embroidery Statement 1.0.14 — Customer macOS app for Intel and Apple Silicon.',
            pub_date: new Date().toISOString(),
            platforms: {
              'darwin-x86_64': {
                signature: process.env.INTEL_SIG,
                url: `https://github.com/${repo}/releases/download/${tag}/${encodeURIComponent(intel)}`
              },
              'darwin-aarch64': {
                signature: process.env.ARM_SIG,
                url: `https://github.com/${repo}/releases/download/${tag}/${encodeURIComponent(arm)}`
              }
            }
          };
          fs.writeFileSync('latest-customer-macos.json', JSON.stringify(manifest, null, 2));
          NODE

      - name: Publish Customer macOS DMGs to v1.0.14
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$RELEASE_TAG" "$INTEL_NAME" "$INTEL_NAME.sig" "$ARM_NAME" "$ARM_NAME.sig" latest-customer-macos.json --repo "$GITHUB_REPOSITORY" --clobber

      - name: Verify published macOS release assets
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets > release-assets.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const release = JSON.parse(fs.readFileSync('release-assets.json', 'utf8'));
          const names = new Set(release.assets.map(a => a.name));
          for (const name of [process.env.INTEL_NAME, process.env.ARM_NAME, process.env.INTEL_NAME + '.sig', process.env.ARM_NAME + '.sig', 'latest-customer-macos.json']) {
            if (!names.has(name)) throw new Error('Missing published release asset: ' + name);
          }
          console.log('Both signed Customer macOS installers and updater manifest are published.');
          NODE
