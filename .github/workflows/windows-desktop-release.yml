name: Windows Desktop - Signed Release
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
permissions:
  contents: write
jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Install Windows Rollup native optional binary
        run: npm install --no-save --no-package-lock @rollup/rollup-win32-x64-msvc@4.62.3
      - name: Verify attendance rules
        run: npm run test:attendance
      - name: Generate official Windows branding
        run: npm run desktop:icons
      - name: Validate signing and release version (never print private key)
        env:
          EMBROIDERY_UPDATE_PUBLIC_KEY: ${{ vars.EMBROIDERY_UPDATE_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/prepare-signed-desktop-release.mjs
      - name: Build, sign and upload NSIS installer and latest.json
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EMBROIDERY_UPDATE_PUBLIC_KEY: ${{ vars.EMBROIDERY_UPDATE_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Embroidery Statement ${{ github.ref_name }}
          releaseBody: 'Windows installer, portable distribution, signed updater manifest and release notes.'
          releaseDraft: true
          prerelease: false
          args: '--bundles nsis'
          updaterJsonPreferNsis: true
      - name: Smoke test the signed installer before publication
        shell: pwsh
        run: ./scripts/windows-installer-smoke.ps1
      - name: Package portable build separately (preserve local data directory)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item "src-tauri/target/release/embroidery-statement.exe" "portable/"
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "portable/MicrosoftEdgeWebView2Setup.exe"
          if ((Get-Item "portable/MicrosoftEdgeWebView2Setup.exe").Length -lt 100000) { throw "WebView2 bootstrapper download looks incomplete." }
          New-Item -ItemType File -Force -Path "portable/.portable" | Out-Null
          "Portable Embroidery Statement: If WebView2 Runtime is missing, run MicrosoftEdgeWebView2Setup.exe (internet required). Keep this folder and data/ together during transfer or updates. Portable automatic updating is disabled; download a newer portable ZIP and replace ONLY the EXE. Windows native toast notifications require an installed app identity." | Set-Content -Path "portable/README.txt" -Encoding UTF8
          Compress-Archive -Path portable -DestinationPath "Embroidery-Statement-${{ github.ref_name }}-Portable.zip" -Force
      - name: Attach portable ZIP to the same GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: gh release upload "${{ github.ref_name }}" "Embroidery-Statement-${{ github.ref_name }}-Portable.zip" --clobber

      - name: Publish release only after installer smoke tests pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: gh release edit "${{ github.ref_name }}" --draft=false
