name: Windows Desktop Signed Release

on:
  push:
    branches:
      - release
      - 'release/*'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag matching package.json, Cargo.toml and tauri.conf.json (example: v1.0.3)'
        required: true
        type: string
        default: 'v1.0.3'

permissions:
  contents: write

concurrency:
  group: windows-desktop-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  publish-windows:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      EMBROIDERY_UPDATE_PUBLIC_KEY: ${{ vars.EMBROIDERY_UPDATE_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Initialize MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Rust MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install locked dependencies
        run: npm ci

      - name: Install Windows Rollup native binary
        run: npm install --no-save --no-package-lock @rollup/rollup-win32-x64-msvc@4.62.3

      - name: Type-check application
        run: npm run typecheck

      - name: Test attendance and Dhaka reminder logic
        run: npm run test:attendance
      - name: Test App Lock security contract
        run: npm run test:app-lock

      - name: Generate Windows icons
        run: npm run desktop:icons

      - name: Resolve release tag from app version on the release branch
        if: startsWith(github.ref, 'refs/heads/release')
        shell: pwsh
        run: |
          $version = (Get-Content 'package.json' -Raw | ConvertFrom-Json).version
          "RELEASE_TAG=v$version" >> $env:GITHUB_ENV

      - name: Validate release version and configure updater public key
        run: node scripts/prepare-signed-desktop-release.mjs

      - name: Build signed Windows installer and updater artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npx --yes @tauri-apps/cli@2 build --bundles nsis
          if ($LASTEXITCODE -ne 0) { throw 'Signed Tauri NSIS build failed.' }

      - name: Generate Tauri updater manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content 'package.json' -Raw | ConvertFrom-Json).version
          $bundleDirectory = 'src-tauri/target/release/bundle/nsis'
          $installer = Get-ChildItem $bundleDirectory -Filter '*.exe' |
            Where-Object { $_.Name -notmatch 'uninstall' } |
            Select-Object -First 1
          if (-not $installer) { throw 'Signed NSIS installer was not generated.' }

          $signaturePath = $installer.FullName + '.sig'
          if (-not (Test-Path $signaturePath)) {
            throw "Tauri updater signature is missing: $signaturePath"
          }
          $signature = [System.IO.File]::ReadAllText($signaturePath).Trim()
          if ([string]::IsNullOrWhiteSpace($signature)) { throw 'Tauri updater signature is empty.' }

          $encodedAssetName = [uri]::EscapeDataString($installer.Name)
          $downloadUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/$encodedAssetName"
          $manifest = [ordered]@{
            version = $version
            notes = "Embroidery Statement $version — Windows x64 update."
            pub_date = [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                signature = $signature
                url = $downloadUrl
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 8 | Set-Content -Path 'latest.json' -Encoding utf8
          Write-Host "Updater manifest prepared for $version."

      - name: Verify 1.0.1 to current-version in-place upgrade and user-data preservation
        shell: pwsh
        env:
          PREVIOUS_INSTALLER_URL: https://github.com/emonak71-sketch/EMBRODERY-STATMENT/releases/download/v1.0.1/Embroidery.Statement_1.0.1_x64-setup.exe
          PREVIOUS_INSTALLER_SHA256: 919ff2393c44b66f2c2d3561a9c2c69c02d1c3546e1cf873ce073a8757836289
        run: ./scripts/windows-upgrade-smoke.ps1

      - name: Run Windows installer, tray and native notification smoke test
        shell: pwsh
        run: ./scripts/windows-installer-smoke.ps1

      - name: Publish or update signed GitHub Release and updater manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' |
            Where-Object { $_.Name -notmatch 'uninstall' } |
            Select-Object -First 1
          if (-not $installer) { throw 'Installer asset is missing.' }
          $signature = $installer.FullName + '.sig'
          if (-not (Test-Path $signature)) { throw 'Updater signature asset is missing.' }
          $assets = @($installer.FullName, $signature, 'latest.json')

          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $env:RELEASE_TAG already exists; replacing only its signed installer, signature and updater manifest."
            gh release upload $env:RELEASE_TAG @assets --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Updating the existing GitHub Release assets failed.' }
            gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --title "Embroidery Statement $env:RELEASE_TAG" --notes-file "RELEASE_NOTES_$((Get-Content 'package.json' -Raw | ConvertFrom-Json).version).md" --latest --target $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw 'Updating the GitHub Release metadata failed.' }
          } else {
            gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --title "Embroidery Statement $env:RELEASE_TAG" --notes-file "RELEASE_NOTES_$((Get-Content 'package.json' -Raw | ConvertFrom-Json).version).md" --latest --target $env:GITHUB_SHA @assets
            if ($LASTEXITCODE -ne 0) { throw 'GitHub Release creation failed.' }
          }

      - name: Verify published updater manifest and download URLs
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content 'package.json' -Raw | ConvertFrom-Json).version
          $headers = @{
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            Authorization = "Bearer $env:GH_TOKEN"
            'Cache-Control' = 'no-cache'
          }
          $releaseApi = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG"
          $release = Invoke-RestMethod -Uri $releaseApi -Headers $headers -TimeoutSec 30
          $installer = $release.assets | Where-Object { $_.name -like "*$version*x64-setup.exe" } | Select-Object -First 1
          $manifestAsset = $release.assets | Where-Object { $_.name -eq 'latest.json' } | Select-Object -First 1
          if (-not $installer -or -not $manifestAsset) { throw 'The release is missing the expected installer or latest.json asset.' }

          $manifest = Invoke-RestMethod -Uri $manifestAsset.browser_download_url -Headers @{'Cache-Control'='no-cache'} -TimeoutSec 60
          if ($manifest.version -ne $version) { throw "Published updater manifest version mismatch: expected $version, got $($manifest.version)." }
          $platform = $manifest.platforms.'windows-x86_64'
          if (-not $platform.signature) { throw 'Published updater manifest has no Windows signature.' }
          if ($platform.url -ne $installer.browser_download_url) {
            throw "Updater manifest URL does not match the uploaded installer asset. Manifest: $($platform.url); asset: $($installer.browser_download_url)"
          }

          $latestManifestUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/latest.json"
          $latestManifest = Invoke-RestMethod -Uri $latestManifestUrl -Headers @{'Cache-Control'='no-cache'} -TimeoutSec 60
          if ($latestManifest.version -ne $version) { throw "The updater's /latest/ endpoint returned $($latestManifest.version), not $version." }

          $urls = @($manifestAsset.browser_download_url, $latestManifestUrl, $platform.url)
          foreach ($url in $urls) {
            $verified = $false
            for ($attempt = 1; $attempt -le 5; $attempt++) {
              try {
                $response = Invoke-WebRequest -Uri $url -Method Head -MaximumRedirection 10 -TimeoutSec 60
                if ($response.StatusCode -eq 200) { $verified = $true; break }
              } catch {
                if ($attempt -eq 5) { throw "Published updater URL returned an error after 5 attempts: $url — $($_.Exception.Message)" }
                Start-Sleep -Seconds 4
              }
            }
            if (-not $verified) { throw "Published updater URL did not return HTTP 200: $url" }
            Write-Host "Verified HTTP 200: $url"
          }
# Signing credentials are provisioned by the one-time local updater setup.
