name: Windows Desktop Signed Release

on:
  push:
    branches:
      - release
      - 'release/*'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag matching package.json, Cargo.toml and both Tauri configs (example: v1.0.3)'
        required: true
        type: string
        default: 'v1.0.3'

permissions:
  contents: write

concurrency:
  group: windows-desktop-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  publish-windows:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      EMBROIDERY_UPDATE_PUBLIC_KEY: ${{ vars.EMBROIDERY_UPDATE_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Initialize MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Rust MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install locked dependencies
        run: npm ci

      - name: Install Windows Rollup native binary
        run: npm install --no-save --no-package-lock @rollup/rollup-win32-x64-msvc@4.62.3

      - name: Type-check application
        run: npm run typecheck

      - name: Test attendance and Dhaka reminder logic
        run: npm run test:attendance

      - name: Test App Lock security contract
        run: npm run test:app-lock

      - name: Generate Windows icons
        run: npm run desktop:icons

      - name: Resolve release tag from app version on the release branch
        if: startsWith(github.ref, 'refs/heads/release')
        shell: pwsh
        run: |
          $version = (Get-Content 'package.json' -Raw | ConvertFrom-Json).version
          "RELEASE_TAG=v$version" >> $env:GITHUB_ENV

      - name: Validate release version and configure both updater public keys
        run: node scripts/prepare-signed-desktop-release.mjs

      - name: Build signed Customer Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npx --yes @tauri-apps/cli@2 build --bundles nsis
          if ($LASTEXITCODE -ne 0) { throw 'Signed Customer NSIS build failed.' }

      - name: Generate Customer updater manifests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content 'package.json' -Raw | ConvertFrom-Json).version
          $bundleDirectory = 'src-tauri/target/release/bundle/nsis'
          $installer = Get-ChildItem $bundleDirectory -Filter '*.exe' |
            Where-Object { $_.Name -notmatch 'uninstall' -and $_.Name -notmatch 'Owner' } |
            Select-Object -First 1
          if (-not $installer) { throw 'Signed Customer NSIS installer was not generated.' }
          $signaturePath = $installer.FullName + '.sig'
          if (-not (Test-Path $signaturePath)) { throw "Customer updater signature is missing: $signaturePath" }
          $signature = [System.IO.File]::ReadAllText($signaturePath).Trim()
          if ([string]::IsNullOrWhiteSpace($signature)) { throw 'Customer updater signature is empty.' }
          $encodedAssetName = [uri]::EscapeDataString($installer.Name)
          $downloadUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/$encodedAssetName"
          $manifest = [ordered]@{
            version = $version
            notes = "Embroidery Statement $version — Customer Windows x64 update."
            pub_date = [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{ signature = $signature; url = $downloadUrl }
            }
          }
          $manifest | ConvertTo-Json -Depth 8 | Set-Content -Path 'latest-customer.json' -Encoding utf8
          Copy-Item 'latest-customer.json' 'latest.json' -Force
          Write-Host "Customer updater manifest prepared for $version."

      - name: Verify 1.0.1 to current Customer version in-place upgrade and user-data preservation
        shell: pwsh
        env:
          PREVIOUS_INSTALLER_URL: https://github.com/emonak71-sketch/EMBRODERY-STATMENT/releases/download/v1.0.1/Embroidery.Statement_1.0.1_x64-setup.exe
          PREVIOUS_INSTALLER_SHA256: 919ff2393c44b66f2c2d3561a9c2c69c02d1c3546e1cf873ce073a8757836289
        run: ./scripts/windows-upgrade-smoke.ps1

      - name: Run Customer installer, tray and native notification smoke test
        shell: pwsh
        run: ./scripts/windows-installer-smoke.ps1

      - name: Build signed Owner Control Center Windows installer
        shell: pwsh
        env:
          EMBROIDERY_OWNER_BUILD: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          npx --yes @tauri-apps/cli@2 build --bundles nsis --config src-tauri/tauri.owner.conf.json
          if ($LASTEXITCODE -ne 0) { throw 'Signed Owner Control Center NSIS build failed.' }

      - name: Generate Owner updater manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content 'package.json' -Raw | ConvertFrom-Json).version
          $bundleDirectory = 'src-tauri/target/release/bundle/nsis'
          $installer = Get-ChildItem $bundleDirectory -Filter '*.exe' |
            Where-Object { $_.Name -match 'Owner' -and $_.Name -notmatch 'uninstall' } |
            Select-Object -First 1
          if (-not $installer) { throw 'Signed Owner Control Center NSIS installer was not generated.' }
          $signaturePath = $installer.FullName + '.sig'
          if (-not (Test-Path $signaturePath)) { throw "Owner updater signature is missing: $signaturePath" }
          $signature = [System.IO.File]::ReadAllText($signaturePath).Trim()
          if ([string]::IsNullOrWhiteSpace($signature)) { throw 'Owner updater signature is empty.' }
          $encodedAssetName = [uri]::EscapeDataString($installer.Name)
          $downloadUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/$encodedAssetName"
          $manifest = [ordered]@{
            version = $version
            notes = "Embroidery Statement Owner Control Center $version — Windows x64 update."
            pub_date = [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{ signature = $signature; url = $downloadUrl }
            }
          }
          $manifest | ConvertTo-Json -Depth 8 | Set-Content -Path 'latest-owner.json' -Encoding utf8
          Write-Host "Owner updater manifest prepared for $version."

      - name: Publish or update signed GitHub Release and both updater channels
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $bundleDirectory = 'src-tauri/target/release/bundle/nsis'
          $customerInstaller = Get-ChildItem $bundleDirectory -Filter '*.exe' |
            Where-Object { $_.Name -notmatch 'uninstall' -and $_.Name -notmatch 'Owner' } |
            Select-Object -First 1
          $ownerInstaller = Get-ChildItem $bundleDirectory -Filter '*.exe' |
            Where-Object { $_.Name -match 'Owner' -and $_.Name -notmatch 'uninstall' } |
            Select-Object -First 1
          if (-not $customerInstaller -or -not $ownerInstaller) { throw 'Both Customer and Owner installers must exist before publishing.' }
          $customerSignature = $customerInstaller.FullName + '.sig'
          $ownerSignature = $ownerInstaller.FullName + '.sig'
          if (-not (Test-Path $customerSignature) -or -not (Test-Path $ownerSignature)) { throw 'One or both updater signatures are missing.' }
          $assets = @($customerInstaller.FullName,$customerSignature,$ownerInstaller.FullName,$ownerSignature,'latest.json','latest-customer.json','latest-owner.json')

          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @assets --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Updating the existing signed release assets failed.' }
            gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --title "Embroidery Statement $env:RELEASE_TAG" --notes-file "RELEASE_NOTES_$((Get-Content 'package.json' -Raw | ConvertFrom-Json).version).md" --latest --target $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw 'Updating the existing release metadata failed.' }
          } else {
            gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --title "Embroidery Statement $env:RELEASE_TAG" --notes-file "RELEASE_NOTES_$((Get-Content 'package.json' -Raw | ConvertFrom-Json).version).md" --latest --target $env:GITHUB_SHA @assets
            if ($LASTEXITCODE -ne 0) { throw 'Creating the signed release failed.' }
          }

      - name: Verify both published updater channels and download URLs
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content 'package.json' -Raw | ConvertFrom-Json).version
          $headers = @{
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            Authorization = "Bearer $env:GH_TOKEN"
            'Cache-Control' = 'no-cache'
          }
          $releaseApi = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG"
          $release = Invoke-RestMethod -Uri $releaseApi -Headers $headers -TimeoutSec 30
          $customerInstaller = $release.assets | Where-Object { $_.name -like "*$version*x64-setup.exe" -and $_.name -notmatch 'Owner' } | Select-Object -First 1
          $ownerInstaller = $release.assets | Where-Object { $_.name -like "*$version*x64-setup.exe" -and $_.name -match 'Owner' } | Select-Object -First 1
          $customerManifestAsset = $release.assets | Where-Object { $_.name -eq 'latest-customer.json' } | Select-Object -First 1
          $ownerManifestAsset = $release.assets | Where-Object { $_.name -eq 'latest-owner.json' } | Select-Object -First 1
          $legacyManifestAsset = $release.assets | Where-Object { $_.name -eq 'latest.json' } | Select-Object -First 1
          if (-not $customerInstaller -or -not $ownerInstaller -or -not $customerManifestAsset -or -not $ownerManifestAsset -or -not $legacyManifestAsset) {
            throw 'The release is missing one of the Customer/Owner installers or updater manifests.'
          }

          $customerManifest = Invoke-RestMethod -Uri $customerManifestAsset.browser_download_url -Headers @{'Cache-Control'='no-cache'} -TimeoutSec 60
          $ownerManifest = Invoke-RestMethod -Uri $ownerManifestAsset.browser_download_url -Headers @{'Cache-Control'='no-cache'} -TimeoutSec 60
          $legacyManifest = Invoke-RestMethod -Uri $legacyManifestAsset.browser_download_url -Headers @{'Cache-Control'='no-cache'} -TimeoutSec 60
          foreach ($manifest in @($customerManifest,$ownerManifest,$legacyManifest)) {
            if ($manifest.version -ne $version) { throw "Updater manifest version mismatch: expected $version, got $($manifest.version)." }
            if (-not $manifest.platforms.'windows-x86_64'.signature) { throw 'An updater manifest has no Windows signature.' }
          }
          if ($customerManifest.platforms.'windows-x86_64'.url -ne $customerInstaller.browser_download_url) { throw 'Customer updater URL does not match its uploaded installer.' }
          if ($ownerManifest.platforms.'windows-x86_64'.url -ne $ownerInstaller.browser_download_url) { throw 'Owner updater URL does not match its uploaded installer.' }
          if ($legacyManifest.platforms.'windows-x86_64'.url -ne $customerInstaller.browser_download_url) { throw 'Legacy updater URL does not match the Customer installer.' }

          $latestUrls = @(
            "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/latest-customer.json",
            "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/latest-owner.json",
            "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/latest.json"
          )
          foreach ($url in $latestUrls) {
            $manifest = Invoke-RestMethod -Uri $url -Headers @{'Cache-Control'='no-cache'} -TimeoutSec 60
            if ($manifest.version -ne $version) { throw "Latest updater endpoint $url returned $($manifest.version), expected $version." }
          }

          $urls = @($customerManifestAsset.browser_download_url,$ownerManifestAsset.browser_download_url,$legacyManifestAsset.browser_download_url,$customerInstaller.browser_download_url,$ownerInstaller.browser_download_url) + $latestUrls
          foreach ($url in $urls) {
            $verified = $false
            for ($attempt = 1; $attempt -le 5; $attempt++) {
              try {
                $response = Invoke-WebRequest -Uri $url -Method Head -MaximumRedirection 10 -TimeoutSec 60
                if ($response.StatusCode -eq 200) { $verified = $true; break }
              } catch {
                if ($attempt -eq 5) { throw "Published updater URL returned an error after 5 attempts: $url — $($_.Exception.Message)" }
                Start-Sleep -Seconds 4
              }
            }
            if (-not $verified) { throw "Published updater URL did not return HTTP 200: $url" }
            Write-Host "Verified HTTP 200: $url"
          }
# Signing credentials are provisioned by the one-time local updater setup.

  publish-android-apk:
    name: Publish signed Android customer APK (direct download)
    needs: publish-windows
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve Android release version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF" == refs/heads/release* ]]; then
            RELEASE_TAG="v$VERSION"
          fi
          if [[ "$RELEASE_TAG" != "v$VERSION" ]]; then
            echo "Release tag $RELEASE_TAG does not match app version v$VERSION."
            exit 1
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Check persistent Android release signing credentials
        id: android_signing
        shell: bash
        run: |
          if [[ -z "$ANDROID_KEY_BASE64" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" || -z "$ANDROID_STORE_PASSWORD" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Android APK publication skipped. Persistent ANDROID_KEY_BASE64, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD and ANDROID_STORE_PASSWORD GitHub Actions secrets are not configured. A new signing key will not be generated automatically."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java
        if: steps.android_signing.outputs.available == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: steps.android_signing.outputs.available == 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK and NDK components
        if: steps.android_signing.outputs.available == 'true'
        shell: bash
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"

      - name: Set up Rust Android target
        if: steps.android_signing.outputs.available == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install locked dependencies
        if: steps.android_signing.outputs.available == 'true'
        run: npm ci

      - name: Initialize Tauri Android project
        if: steps.android_signing.outputs.available == 'true'
        run: npx --yes @tauri-apps/cli@2 android init --ci --skip-targets-install

      - name: Configure persistent Android APK signing
        if: steps.android_signing.outputs.available == 'true'
        shell: bash
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/embroidery-android-release.jks"
          printf '%s' "$ANDROID_KEY_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          {
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'storePassword=%s\n' "$ANDROID_STORE_PASSWORD"
            printf 'storeFile=%s\n' "$KEYSTORE_PATH"
          } > src-tauri/gen/android/keystore.properties
          node scripts/configure-android-signing.mjs

      - name: Build signed direct-install APK (no AAB)
        if: steps.android_signing.outputs.available == 'true'
        shell: bash
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          export ANDROID_NDK_HOME="$NDK_HOME"
          npx --yes @tauri-apps/cli@2 android build --apk --ci --target aarch64

      - name: Prepare APK and update manifest
        if: steps.android_signing.outputs.available == 'true'
        shell: bash
        run: |
          APK_PATH="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          if [[ -z "$APK_PATH" ]]; then
            echo "No Android APK was generated."
            exit 1
          fi
          cp "$APK_PATH" Embroidery-Statement-Android.apk
          node scripts/create-android-release-manifest.mjs "$PWD/Embroidery-Statement-Android.apk" "$RELEASE_TAG" "$GITHUB_REPOSITORY"

      - name: Upload APK and Android update manifest to the existing release
        if: steps.android_signing.outputs.available == 'true'
        shell: bash
        run: |
          gh release upload "$RELEASE_TAG" Embroidery-Statement-Android.apk latest-android.json --clobber --repo "$GITHUB_REPOSITORY"

      - name: Verify direct APK release and latest Android update endpoint
        if: steps.android_signing.outputs.available == 'true'
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/latest-android.json?verify=$attempt" -o downloaded-latest-android.json; then
              break
            fi
            sleep 4
          done
          node -e "const m=require('./downloaded-latest-android.json'); if(m.version!==process.env.ANDROID_VERSION) throw new Error('Android version mismatch'); if(m.package_id!=='com.embroidery.statement') throw new Error('Android package ID mismatch'); if(!m.apk_url.includes('/'+process.env.RELEASE_TAG+'/Embroidery-Statement-Android.apk')) throw new Error('APK URL mismatch'); if(!/^[a-f0-9]{64}$/.test(m.sha256)) throw new Error('Invalid APK SHA-256'); console.log('Verified Android update manifest for '+m.version)"
          curl -fIsL "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/Embroidery-Statement-Android.apk" >/dev/null

      - name: Report missing Android signing credentials
        if: steps.android_signing.outputs.available != 'true'
        run: echo "Android APK release is waiting for the existing persistent Android keystore. No Play Store/AAB publication is configured."
