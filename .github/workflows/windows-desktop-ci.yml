name: Windows Desktop - Tauri Build Check
on:
  # Run one Windows native build for each update to the desktop feature branch.
  push:
    branches:
      - feature/tauri2-windows-desktop
  workflow_dispatch:
concurrency:
  group: windows-desktop-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Validate PowerShell setup and installer scripts
        shell: pwsh
        run: |
          $scripts = @(
            'scripts/generate-tauri-signing-key.ps1',
            'scripts/configure-github-updater-secrets.ps1',
            'scripts/windows-installer-smoke.ps1'
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $script), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              throw "PowerShell syntax error in $($script): $($errors -join '; ')"
            }
            Write-Host "PASS: PowerShell syntax $script"
          }
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Install Windows Rollup native optional binary
        run: npm install --no-save --no-package-lock @rollup/rollup-win32-x64-msvc@4.62.3
      - name: Validate existing web/PWA build
        run: npm run build
      - name: Test attendance completeness and Dhaka schedule
        run: npm run test:attendance
      - name: Generate Windows application icons from the official logo
        run: npm run desktop:icons
      - name: Compile native Windows application (without signed release bundles)
        run: npx --yes @tauri-apps/cli@2 build --no-bundle
      - name: Upload resolved Rust dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: tauri-cargo-lockfile
          path: src-tauri/Cargo.lock
          if-no-files-found: error
      - name: Build unsigned NSIS installer preview
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis --config src-tauri/tauri.preview.conf.json
      - name: Smoke test installed Windows application
        shell: pwsh
        run: ./scripts/windows-installer-smoke.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer-preview-unsigned
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Stage the portable preview
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item "src-tauri/target/release/embroidery-statement.exe" "portable/"
          New-Item -ItemType File -Force -Path "portable/.portable" | Out-Null
          "Portable preview: Requires Microsoft WebView2 Runtime. Keep data/ in this directory when replacing the EXE. Native Windows notifications may require installation." | Set-Content -Path "portable/README.txt" -Encoding UTF8
          Compress-Archive -Path portable -DestinationPath Embroidery-Statement-Portable-PREVIEW.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable-preview-unsigned
          path: Embroidery-Statement-Portable-PREVIEW.zip
          if-no-files-found: error
