name: Windows Desktop - Source and Native Code Checks
on:
  # Verify the merged production desktop source and future desktop changes.
  push:
    branches:
      - main
      - feature/tauri2-windows-desktop
  workflow_dispatch:
concurrency:
  group: windows-desktop-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows-build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Verify Windows MSVC v143, Windows 11 SDK, Rust MSVC target and Tauri prerequisites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw 'Visual Studio Installer vswhere.exe not found.' }
          $vsPath = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw 'Visual Studio C++ x64/x86 build tools are not installed.' }
          $msvcRoot = Join-Path $vsPath 'VC\Tools\MSVC'
          $v143 = Get-ChildItem $msvcRoot -Directory | Where-Object { $_.Name -match '^14\.(3[0-9]|4[0-9])\.' } | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $v143) { throw 'MSVC v143 toolset (14.3x/14.4x) not found.' }
          if ($env:VCToolsVersion -notmatch '^14\.(3[0-9]|4[0-9])\.') { throw "Active compiler toolset is not v143: $env:VCToolsVersion" }
          $compiler = Get-Command cl.exe -ErrorAction SilentlyContinue
          if (-not $compiler) { throw 'MSVC compiler cl.exe is not available after developer environment initialization.' }
          $kits = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots' -ErrorAction Stop
          $sdkRoot = $kits.KitsRoot10
          if (-not $sdkRoot -or -not (Test-Path (Join-Path $sdkRoot 'Include'))) { throw 'Windows SDK root is missing.' }
          $sdk = Get-ChildItem (Join-Path $sdkRoot 'Include') -Directory | Where-Object { $_.Name -match '^10\.' } | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $sdk) { throw 'Windows 10/11 SDK headers are missing.' }
          $sdkLib = Join-Path (Join-Path $sdkRoot 'Lib') $sdk.Name
          if (-not (Test-Path $sdkLib)) { throw "Windows SDK libraries are missing for $($sdk.Name)." }
          rustc -Vv
          cargo -V
          $installed = rustup target list --installed
          if ($installed -notcontains 'x86_64-pc-windows-msvc') { throw 'Rust x86_64-pc-windows-msvc target is not installed.' }
          Write-Host "PASS: Visual Studio 2022: $vsPath"
          Write-Host "PASS: active MSVC toolset: $env:VCToolsVersion"
          Write-Host "PASS: MSVC v143: $($v143.Name)"
          Write-Host "PASS: compiler: $($compiler.Source)"
          Write-Host "PASS: Windows SDK: $($sdk.Name) at $sdkRoot"
          Write-Host 'PASS: Rust target x86_64-pc-windows-msvc'
      - name: Set up Deno for Supabase Edge Function checks
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Validate PowerShell setup and installer scripts
        shell: pwsh
        run: |
          $scripts = @(
            'scripts/generate-tauri-signing-key.ps1',
            'scripts/build-windows-desktop-signed.ps1',
            'scripts/configure-github-updater-secrets.ps1',
            'scripts/windows-installer-smoke.ps1'
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $script), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              throw "PowerShell syntax error in $($script): $($errors -join '; ')"
            }
            Write-Host "PASS: PowerShell syntax $script"
          }
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Install Windows Rollup native optional binary
        run: npm install --no-save --no-package-lock @rollup/rollup-win32-x64-msvc@4.62.3
      - name: Validate Node release helper syntax
        run: |
          node --check scripts/bump-version.mjs
          node --check scripts/prepare-signed-desktop-release.mjs
          node --check scripts/prepare-local-signed-build.mjs
      - name: Type-check the React and TypeScript application
        run: npm run typecheck
      - name: Type-check the Supabase Edge Function in its Deno runtime
        run: deno check --no-lock supabase/functions/send-worker-sms/index.ts
      - name: Validate existing web/PWA production build
        run: npm run build
      - name: Test attendance completeness and Dhaka schedule
        run: npm run test:attendance
      - name: Generate Windows application icons from the official logo
        run: npm run desktop:icons
      - name: Validate Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Compile Tauri 2 native Windows code without producing an EXE or installer
        run: cargo check --target x86_64-pc-windows-msvc --manifest-path src-tauri/Cargo.toml
