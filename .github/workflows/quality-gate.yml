name: Existing app quality gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Production customer and Owner Web/PWA build
        run: npm run build

      - name: Verify customer-only desktop and Android bundle
        run: npm run build:customer

      - name: Verify separate Owner PWA and desktop bundle
        run: npm run build:owner

  windows-desktop:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Initialize MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Set up Rust MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install locked dependencies
        run: npm ci
      - name: Install Windows Rollup native binary
        run: npm install --no-save --no-package-lock @rollup/rollup-win32-x64-msvc@4.62.3
      - name: Type-check application
        run: npm run typecheck
      - name: Test attendance and Dhaka reminder logic
        run: npm run test:attendance
      - name: Test App Lock security contract
        run: npm run test:app-lock
      - name: Generate Windows icons
        run: npm run desktop:icons
      - name: Build unsigned NSIS installer for CI only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npx --yes @tauri-apps/cli@2 build --bundles nsis --config src-tauri/tauri.unsigned.conf.json
          if ($LASTEXITCODE -ne 0) { throw 'Tauri NSIS build failed.' }
      - name: Install and smoke-test Windows app and native notification dispatch
        shell: pwsh
        run: ./scripts/windows-installer-smoke.ps1
      - name: Upload verified Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Embroidery-Statement-Windows-CI-${{ github.run_number }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

      - name: Remove Customer installer from shared bundle output
        shell: pwsh
        run: |
          Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' |
            Where-Object { $_.Name -notmatch 'Owner' } |
            Remove-Item -Force

      - name: Build separate Owner Control Center Windows installer
        shell: pwsh
        env:
          EMBROIDERY_OWNER_BUILD: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          npx --yes @tauri-apps/cli@2 build --bundles nsis --config src-tauri/tauri.owner.conf.json --config src-tauri/tauri.unsigned.conf.json
          if ($LASTEXITCODE -ne 0) { throw 'Owner Control Center NSIS build failed.' }

      - name: Install and smoke-test Owner Control Center
        shell: pwsh
        run: ./scripts/windows-owner-installer-smoke.ps1

      - name: Upload Owner Control Center Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Embroidery-Statement-Owner-Windows-CI-${{ github.run_number }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
