<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Embroidery Statement embroidered logo</title>
  <desc id="desc">A navy and red embroidery thread emblem with a needle and spool on cream woven fabric.</desc>
  <defs>
    <linearGradient id="fabric" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#eee2cf"/>
    </linearGradient>
    <linearGradient id="navyThread" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#294a79"/><stop offset=".5" stop-color="#0d2347"/><stop offset="1" stop-color="#42658f"/>
    </linearGradient>
    <linearGradient id="redThread" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5962"/><stop offset=".48" stop-color="#c51f35"/><stop offset="1" stop-color="#861a2c"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/><stop offset=".38" stop-color="#8fa5bc"/><stop offset=".62" stop-color="#fff"/><stop offset="1" stop-color="#526982"/>
    </linearGradient>
    <pattern id="weave" width="10" height="10" patternUnits="userSpaceOnUse">
